
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektron Laboratuvarı</title>

    <style>
        body {
            background-color: #0d2036;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 80px 20px;
        }

        h1 {
            color: #64c5ff;
            font-size: 36px;
        }

        p {
            color: #b9d4e8;
            font-size: 18px;
        }

        button {
            background-color: #64c5ff;
            color: #0d2036;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
        }

        button:hover {
            background-color: #a4e0ff;
        }
    </style>
</head>

<div id="elementEkrani" style="display: none;">

    <h2>ELEMENTİNİ SEÇ</h2>

    <p>Elektron dizilimini oluştur!</p>

    <button onclick="elementSec('Hidrojen', 1)">
        H - Hidrojen
    </button>

    <button onclick="elementSec('Helyum', 2)">
        He - Helyum
    </button>

    <button onclick="elementSec('Lityum', 3)">
        Li - Lityum
    </button>

    <button onclick="elementSec('Karbon', 6)">
        C - Karbon
    </button>

    <button onclick="elementSec('Azot', 7)">
        N - Azot
    </button>

    <button onclick="elementSec('Oksijen', 8)">
        O - Oksijen
    </button>

</div>

<script>
    function oyunuBaslat() {
        document.getElementById("elementEkrani").style.display = "block";
    }

    function elementSec(isim, numara) {
        alert(isim + " seçildi! Atom numarası: " + numara);
    }
</script>

<body>
    <h1>ELEKTRON LABORATUVARI</h1>

    <p>Aufbau • Pauli • Hund</p>

    <button onclick="oyunuBaslat()">OYUNA BAŞLA</button>

    <p>Kimya öğrenmenin eğlenceli yolu</p>
</body>
</html>
