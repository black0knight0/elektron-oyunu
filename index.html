
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektron Laboratuvarı</title>

    <style>
        body {
            background-color: #0d2036;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 80px 20px;
        }

        h1 {
            color: #64c5ff;
        }

        button {
            background-color: #64c5ff;
            color: #0d2036;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
        }

        button:hover {
            background-color: #a4e0ff;
        }
   
.orbital {
    background-color: #173550;
    display: inline-block;
    padding: 20px;
    margin: 10px;
    border-radius: 12px;
}

.kutu {
    display: inline-block;
    width: 35px;
    height: 45px;
    background-color: #244663;
    border-bottom: 3px solid #64c5ff;
    margin: 4px;
}

    </style>
</head>

<body>

    <div id="anaEkran">
        <h1>ELEKTRON LABORATUVARI</h1>
        <p>Aufbau • Pauli • Hund</p>
        <button onclick="oyunuBaslat()">
            OYUNA BAŞLA
        </button>
    </div>

    <div id="elementEkrani" style="display: none;">
        <h1>ELEMENTİNİ SEÇ</h1>

        <button onclick="elementSec('Hidrojen', 1)">
            H - Hidrojen
        </button>

        <button onclick="elementSec('Helyum', 2)">
            He - Helyum
        </button>

        <button onclick="elementSec('Karbon', 6)">
            C - Karbon
        </button>

        <button onclick="elementSec('Azot', 7)">
            N - Azot
        </button>
    </div>

<div id="orbitalEkrani" style="display: none;">

    <h1 id="elementBasligi">Karbon (C)</h1>
    <p>Elektronları orbitallere yerleştir!</p>

    <div class="orbital">
        <h2>1s</h2>
        <div class="kutu"></div>
    </div>

    <div class="orbital">
        <h2>2s</h2>
        <div class="kutu"></div>
    </div>

    <div class="orbital">
        <h2>2p</h2>
        <div class="kutu"></div>
        <div class="kutu"></div>
        <div class="kutu"></div>
    </div>

</div>

    <script>
        function oyunuBaslat() {
            document.getElementById("anaEkran").style.display = "none";
            document.getElementById("elementEkrani").style.display = "block";
        }


function elementSec(isim, numara) {

    document.getElementById("elementEkrani").style.display = "none";

    document.getElementById("orbitalEkrani").style.display = "block";

    document.getElementById("elementBasligi").innerText =
        isim + " - Atom numarası: " + numara;

}

    </script>

</body>
</html>
